
name: Build

on:
  push:
    branches:
      - main
      - lab-10-sonarcloud-analysis
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile production classes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/classes, build/test-classes, build/reports | Out-Null
          javac -d build/classes src/gradebook/*.java

      - name: Compile JUnit tests
        shell: pwsh
        run: |
          javac -cp "build/classes;lib/junit-platform-console-standalone-1.14.1.jar" -d build/test-classes tests/*.java

      - name: Run JUnit tests with JaCoCo
        shell: pwsh
        run: |
          java "-javaagent:lib/jacocoagent.jar=destfile=build/jacoco.exec" -jar lib/junit-platform-console-standalone-1.14.1.jar execute --class-path "build/classes;build/test-classes" --scan-class-path

      - name: Generate JaCoCo XML report
        shell: pwsh
        run: |
          java -jar lib/jacococli.jar report build/jacoco.exec --classfiles build/classes --sourcefiles src/gradebook --xml build/reports/jacoco.xml

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
